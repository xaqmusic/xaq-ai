[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zanshin-core"
version = "0.1.0"
description = "Zanshin substrate: message bus, torch predictor/memory, export parity, RNG, logging protocol."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Joseph Butera III" }]
dependencies = [
    "numpy",
    "python-socketio",
    "pyzmq",
]

[project.optional-dependencies]
# The torch substrate (HomeokineticPredictor, KnowledgeGraph, export parity) is
# only needed by the Global Workspace / MetaEPM path.
torch = ["torch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zanshin_core*"]
